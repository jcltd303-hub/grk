name: Deploy GRK to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run rigging regression tests
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@59.20.0

      - name: Link GRK Vercel project
        run: vercel link --yes --project=grk --scope=jcltd303-hubs-projects --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artifact
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production artifact
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
